routing:
  defaultLocalModel: local-mlx
  defaultFallbackModel: local-ollama
  defaultReasoningModel: cloud-reasoning
models:
  # Tier 1 — Apple Silicon GPU via MLX sidecar (fastest local)
  local-mlx:
    provider: mlx
    model: /Users/janipasanen/.lmstudio/models/mlx-community/gemma-3-12b-it-qat-4bit

  # Tier 2 — Local Ollama model (Mistral Ministral 3B, ~2 GB RAM)
  # https://ollama.com/library/ministral-3 — pull with: ollama pull ministral-3:3b
  local-ollama:
    provider: ollama
    model: ministral-3:3b

  # Tier 3 — Cloud brain: plans, coordinates, handles complex reasoning
  cloud-reasoning:
    provider: ollama-cloud
    model: gemini-3-flash-preview:latest
