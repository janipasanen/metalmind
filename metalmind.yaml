routing:
  defaultLocalModel: local-mlx
  defaultFallbackModel: local-ollama
  defaultReasoningModel: cloud-reasoning
models:
  # Tier 1 — Apple Silicon GPU via MLX sidecar (fastest local)
  local-mlx:
    provider: mlx
    model: /Users/janipasanen/.lmstudio/models/lmstudio-community/Ornith-1.0-9B-MLX-4bit

  # Tier 2 — Local Ollama model (installed locally; check with `ollama list`)
  local-ollama:
    provider: ollama
    model: qwen3.5:4b-mlx

  # Tier 3 — Cloud brain: plans, coordinates, handles complex reasoning
  cloud-reasoning:
    provider: ollama-cloud
    model: glm-5.2:cloud
