name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (macOS)
    # MetalMind targets macOS only, so CI runs on macOS to match the runtime and
    # the tests that depend on macOS path semantics.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ripgrep
        # Required by the search / findFiles / replaceInProject tools and their tests.
        run: brew install ripgrep

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b typecheck + bundle)
        run: npm run build

      - name: Test
        run: npm test

  lint:
    name: lint & format (non-blocking)
    runs-on: ubuntu-latest
    # Informational while the existing tree is normalized; does not gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
