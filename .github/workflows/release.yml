name: Release

# Tag a release (e.g. `git tag v0.2.0 && git push --tags`) to build, verify,
# generate a changelog, publish a GitHub Release, and (if configured) npm (#216).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog range works

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install ripgrep
        run: brew install ripgrep

      - run: npm ci
      - name: Build & test
        run: |
          npm run build
          npm test

      - name: Smoke-run built bundle
        # The artifact about to be published must load and execute (#351).
        run: node apps/tui/dist/index.js --version | grep -q "^metalmind "

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          RANGE=${PREV:+$PREV..}${GITHUB_REF_NAME}
          {
            echo 'body<<EOF'
            node scripts/changelog.mjs "$RANGE"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}

      - name: Publish to npm (if NPM_TOKEN is set)
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w apps/tui --access public
